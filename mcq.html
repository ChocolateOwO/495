<script>
/* ===== คลาส ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ความยาวที่ตามองเห็น: ไม่นับสระบน/ล่างและวรรณยุกต์ไทยที่ไม่กินที่ */
class TextLen {
  static visible(s) { return [...String(s).replace(/[ัิ-ฺ็-๎]/g, "")].length; }
  static raw(s) { return [...String(s)].length; }
}

/* ตรวจกติกา: 5 ตัวเลือกไม่ซ้ำ และเฉลยต้องไม่ใช่ตัวที่ยาวที่สุด */
class Rules {
  static check(bank) {
    const issues = [];
    for (const ch of bank) ch.q.forEach((x, i) => {
      const id = `${ch.id}#${i + 1}`;
      if (!Array.isArray(x.d) || x.d.length !== 4) issues.push(`${id}: ต้องมีตัวลวง 4 ตัว`);
      const all = [x.a, ...(x.d || [])];
      if (new Set(all).size !== all.length) issues.push(`${id}: ตัวเลือกซ้ำ`);
      const maxV = Math.max(...x.d.map(TextLen.visible)), maxR = Math.max(...x.d.map(TextLen.raw));
      if (TextLen.visible(x.a) > maxV - CONFIG.MIN_GAP || TextLen.raw(x.a) >= maxR) issues.push(`${id}: เฉลยยาวเกินไป (${TextLen.visible(x.a)} vs ${maxV})`);
    });
    return issues;
  }
}

/* เก็บคะแนนสูงสุดและค่าที่เลือกไว้ในเบราว์เซอร์ */
class Store {
  static read(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  static write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
  static best(id) { const o = Store.read(CONFIG.STORE_BEST, {}); return typeof o[id] === "number" ? o[id] : null; }
  static saveBest(id, pct) { const o = Store.read(CONFIG.STORE_BEST, {}); if (o[id] == null || pct > o[id]) { o[id] = pct; Store.write(CONFIG.STORE_BEST, o); } }
}

/* สุ่มและสลับลำดับ */
class Picker {
  static shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
  static take(a, n) { const s = Picker.shuffle(a); return n > 0 ? s.slice(0, Math.min(n, s.length)) : s; }
}

/* หน้าแรก */
class HomeView {
  constructor(el, app) { this.el = el; this.app = app; }
  render() {
    const size = this.app.size;
    const cards = BANK.map(ch => {
      const b = Store.best(ch.id);
      return `<article class="card"><div class="card-top"><span class="no">${ch.no}</span><span class="term">${ch.term}</span></div>
        <h3>${esc(ch.en)}</h3>
        <p class="focus"><b>เน้น:</b> ${esc(ch.focus)}</p>
        <div class="card-act"><a class="btn sm" href="#${ch.id}">เริ่มทำ (${size || ch.q.length} ข้อ)</a><span class="muted" style="font-size:.8rem">คลัง ${ch.q.length} ข้อ</span>${b != null ? `<span class="best">ดีที่สุด ${b}%</span>` : ""}</div></article>`;
    }).join("");
    const mb = Store.best("mix"), total = BANK.reduce((t, c) => t + c.q.length, 0);
    this.el.innerHTML = `
      <p class="eyebrow">271494 Special Topics in Robotics Engineering 2 · บท 7–12 · คลัง ${total} ข้อ</p>
      <h1>ควิซช้อยส์ 5 ตัวเลือก</h1>
      <p class="lead">คัดจากหัวข้อที่อาจารย์ใช้สไลด์หลายหน้าและกล่องเน้นในสไลด์ ทุกข้อสลับตำแหน่งตัวเลือกใหม่ทุกครั้ง กดส่งแล้วเห็นเฉลยพร้อมเหตุผล</p>
      <ul class="rules">
        <li><b>5 ตัวเลือก</b>ถูก 1 ข้อ</li>
        <li><b>ไม่มีมุก “ข้อยาวสุด”</b>เฉลยไม่เคยเป็นตัวเลือกที่ยาวที่สุด</li>
        <li><b>ส่งแล้วเฉลยทันที</b>มีเหตุผลและเลขสไลด์</li>
        <li><b>ทำซ้ำได้ไม่จำกัด</b>สุ่มชุดใหม่ หรือทำเฉพาะข้อที่ผิด</li>
      </ul>
      <div class="sizes"><span>จำนวนข้อต่อรอบ</span><div class="seg" role="group" aria-label="จำนวนข้อต่อรอบ">${CONFIG.SIZES.map(n => `<button type="button" data-size="${n}" aria-pressed="${n === size}">${n || "ทั้งหมด"}</button>`).join("")}</div></div>
      <div class="grid">${cards}</div>
      <div class="mixcard"><div><h3>สุ่มรวมทุกบท</h3><p>บทละ ${CONFIG.MIX_PER_CHAPTER} ข้อ รวม ${CONFIG.MIX_PER_CHAPTER * BANK.length} ข้อ เหมาะทบทวนก่อนสอบ${mb != null ? ` · ดีที่สุด ${mb}%` : ""}</p></div><a class="btn" href="#mix">เริ่มสุ่มรวม</a></div>`;
    this.el.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => { this.app.setSize(+b.dataset.size); this.render(); }));
  }
}

/* หน้าควิซ: สร้างชุด ตรวจ เฉลย */
class QuizView {
  constructor(el, app) {
    this.el = el; this.app = app; this.set = null; this.done = false;
    el.addEventListener("change", e => { if (e.target.matches("input[type=radio]")) this.progress(); });
    el.addEventListener("click", e => this.onClick(e));
  }
  pack(q, tag) { return { ...q, tag, opts: Picker.shuffle([q.a, ...q.d]), pick: null }; }
  makeSet(id) {
    if (id === "mix") return { id, title: "สุ่มรวมทุกบท", items: Picker.shuffle(BANK.flatMap(ch => Picker.take(ch.q, CONFIG.MIX_PER_CHAPTER).map(q => this.pack(q, ch.no)))) };
    const ch = BANK.find(c => c.id === id);
    return { id, ch, title: `บท ${ch.no} · ${ch.en}`, items: Picker.take(ch.q, this.app.size).map(q => this.pack(q)) };
  }
  open(id, fresh) { if (fresh || !this.set || this.set.id !== id || this.set.only) this.set = this.makeSet(id); this.render(); }
  retry(onlyWrong) {
    const s = this.set;
    const items = (onlyWrong ? s.items.filter(x => x.pick !== x.opts.indexOf(x.a)) : s.items).map(x => ({ ...x, opts: Picker.shuffle(x.opts), pick: null }));
    this.set = { ...s, items, only: onlyWrong };
    this.render();
  }
  itemHTML(x, i) {
    return `<article class="q" id="q${i}" role="radiogroup" aria-labelledby="qt${i}">
      <div class="qno">ข้อ ${i + 1}${x.tag ? ` <span class="tag">บท ${x.tag}</span>` : ""}${x.dt ? ` <span class="dtag">DT</span>` : ""}${x.x ? ` <span class="ext">เสริม</span>` : ""}<span class="verdict" id="v${i}"></span></div>
      <p class="qt" id="qt${i}">${esc(x.q)}</p>
      <div class="opts">${x.opts.map((o, k) => `<label class="opt" id="o${i}_${k}"><input type="radio" name="q${i}" id="r${i}_${k}" value="${k}"><span class="let">${CONFIG.LETTERS[k]}</span><span class="txt">${esc(o)}</span></label>`).join("")}</div>
      <div class="reveal" id="rv${i}" hidden></div></article>`;
  }
  render() {
    this.done = false;
    const s = this.set;
    const head = s.ch
      ? `<p class="eyebrow">บท ${s.ch.no} · ${s.ch.term}${s.only ? " · ทำเฉพาะข้อที่ผิด" : ""}</p><h1>${esc(s.ch.en)}</h1><p class="lead"><b>เน้น:</b> ${esc(s.ch.focus)}</p>`
      : `<p class="eyebrow">ทบทวนรวม${s.only ? " · ทำเฉพาะข้อที่ผิด" : ""}</p><h1>${s.title}</h1><p class="lead">สุ่มบทละ ${CONFIG.MIX_PER_CHAPTER} ข้อจากทุกบท ป้ายสีเทาบอกว่ามาจากบทไหน</p>`;
    this.el.innerHTML = `${head}
      <div id="scorebox" class="scorebox" hidden></div>
      <div id="qs">${s.items.map((x, i) => this.itemHTML(x, i)).join("")}</div>
      <div class="qbar"><div class="qbar-in"><span id="qprog" class="qprog" aria-live="polite"></span><div class="qbtns" id="qbtns"></div></div></div>`;
    this.buttons(); this.progress();
  }
  buttons(wrong) {
    const b = this.el.querySelector("#qbtns");
    b.innerHTML = this.done
      ? `${wrong ? `<button type="button" class="btn sm" data-q="wrong">ทำเฉพาะข้อที่ผิด (${wrong})</button>` : ""}<button type="button" class="btn alt sm" data-q="retry">ทำชุดเดิมอีกครั้ง</button><button type="button" class="btn sm hi" data-q="fresh">สุ่มชุดใหม่</button>`
      : `<button type="button" class="btn" data-q="submit">ส่งคำตอบ</button>`;
  }
  progress() {
    if (this.done) return;
    const n = this.set.items.length, a = this.el.querySelectorAll("input[type=radio]:checked").length;
    const p = this.el.querySelector("#qprog"); if (p) p.textContent = `ตอบแล้ว ${a}/${n} ข้อ`;
  }
  submit() {
    if (this.done) return;
    this.done = true;
    const s = this.set; let ok = 0;
    this.el.querySelector("#qs").classList.add("done");
    s.items.forEach((x, i) => {
      const sel = this.el.querySelector(`input[name="q${i}"]:checked`);
      x.pick = sel ? +sel.value : null;
      const right = x.opts.indexOf(x.a), good = x.pick === right;
      if (good) ok++;
      this.el.querySelectorAll(`input[name="q${i}"]`).forEach(r => { r.disabled = true; });
      this.el.querySelector(`#o${i}_${right}`).classList.add("ok");
      if (x.pick != null && !good) this.el.querySelector(`#o${i}_${x.pick}`).classList.add("bad");
      this.el.querySelector(`#v${i}`).innerHTML = good ? '<span class="okc">✓ ถูก</span>' : `<span class="badc">✗ ${x.pick == null ? "ไม่ได้ตอบ" : "ผิด"} · เฉลย ${CONFIG.LETTERS[right]}</span>`;
      const rv = this.el.querySelector(`#rv${i}`); rv.hidden = false;
      rv.innerHTML = `<p><b>เฉลย ${CONFIG.LETTERS[right]}:</b> ${esc(x.a)}</p>${x.ex ? `<p class="ex">${esc(x.ex)}</p>` : ""}<p class="src">อ้างอิง: สไลด์ ${esc(x.s)}</p>`;
    });
    const n = s.items.length, pct = Math.round(100 * ok / Math.max(1, n)), wrong = n - ok;
    if (!s.only) Store.saveBest(s.id, pct);
    const verdict = pct >= 80 ? "พร้อมสอบส่วนนี้แล้ว กดสุ่มชุดใหม่เพื่อเจอข้ออื่นในคลัง"
      : pct >= 50 ? "อ่านเหตุผลของข้อที่ผิด แล้วกด “ทำเฉพาะข้อที่ผิด”"
      : "ทบทวนสไลด์ตามเลขที่อ้างอิงในเฉลย แล้วทำชุดเดิมอีกครั้ง";
    const box = this.el.querySelector("#scorebox"); box.hidden = false;
    box.innerHTML = `<div class="big">${pct}<small>%</small></div><div><p>ถูก <b>${ok}</b> จาก <b>${n}</b> ข้อ${wrong ? ` · ผิด/ไม่ได้ตอบ ${wrong} ข้อ` : ""}</p><p class="muted">${verdict}</p>${s.only ? '<p class="muted" style="font-size:.85rem">รอบทำเฉพาะข้อที่ผิดไม่นับเป็นคะแนนสูงสุด</p>' : ""}</div>`;
    const p = this.el.querySelector("#qprog"); if (p) p.textContent = `คะแนน ${ok}/${n} (${pct}%)`;
    this.buttons(wrong);
    box.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  onClick(e) {
    const b = e.target.closest("[data-q]"); if (!b) return;
    const act = b.dataset.q;
    if (act === "submit") this.submit();
    else if (act === "retry") { this.retry(false); window.scrollTo(0, 0); }
    else if (act === "wrong") { this.retry(true); window.scrollTo(0, 0); }
    else if (act === "fresh") { this.open(this.set.id, true); window.scrollTo(0, 0); }
  }
}

/* ตัวควบคุมหลัก: hash routing + แถบเลือกบท */
class App {
  constructor() {
    this.main = document.getElementById("main"); this.nav = document.getElementById("chips");
    const s = Store.read(CONFIG.STORE_SIZE, CONFIG.DEFAULT_SIZE);
    this.size = CONFIG.SIZES.includes(s) ? s : CONFIG.DEFAULT_SIZE;
    this.home = new HomeView(this.main, this); this.quiz = new QuizView(this.main, this);
  }
  setSize(n) { this.size = n; Store.write(CONFIG.STORE_SIZE, n); }
  start() {
    const issues = Rules.check(BANK); if (issues.length) console.warn("Rules:", issues);
    this.nav.innerHTML = `<a class="chip" href="#" data-r="">หน้าแรก</a>` +
      BANK.map(ch => `<a class="chip" href="#${ch.id}" data-r="${ch.id}"><b>${ch.no}</b><small>${esc(ch.short)}</small></a>`).join("") +
      `<a class="chip" href="#mix" data-r="mix">สุ่มรวม</a>`;
    addEventListener("hashchange", () => this.route());
    this.route();
  }
  route() {
    const h = decodeURIComponent(location.hash.slice(1)), ch = BANK.find(c => c.id === h);
    if (h === "mix") this.quiz.open("mix", true);
    else if (ch) this.quiz.open(ch.id, true);
    else this.home.render();
    const key = h === "mix" ? "mix" : (ch ? ch.id : "");
    this.nav.querySelectorAll(".chip").forEach(c => { if (c.dataset.r === key) { c.setAttribute("aria-current", "page"); c.scrollIntoView({ block: "nearest", inline: "nearest" }); } else c.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
}

const boot = () => { window.__app = new App(); window.__app.start(); };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
</script>
