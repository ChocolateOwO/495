<section class="sec"><h3>Uncontrolled environment <span class="ref">S8</span></h3>
<p><b>ความเชื่อ (Myth)</b>: สภาพแวดล้อมควบคุมได้ (structured) แบบในโรงงาน · <b>ความจริง</b>: ไร้โครงสร้าง (unstructured) ในป่า ทุ่งนา สนามรบ ไม่มีจุดอ้างอิงที่สมบูรณ์ หุ่นยนต์ต้อง<b>เอาตัวรอดทางกายภาพให้ได้ก่อน</b>สมองกลจึงทำงานได้</p>
<p><mark>Algorithms cannot fix bad physical design.</mark></p>
</section>
<section class="sec"><h3>ระบบขับเคลื่อน (Locomotion) <span class="ref">S9</span></h3>
<div class="tbl"><table><thead><tr><th>แบบ</th><th>ข้อดี</th><th>ข้อเสีย</th><th>สรุป</th></tr></thead><tbody>
<tr><td><b>ล้อมาตรฐาน</b><br><small>Ackermann / Diff drive</small></td><td>สร้างง่าย รับน้ำหนักได้ดี (high payload) วิ่งเร็ว</td><td>ลื่นไถลง่ายในโคลน · Non-holonomic (เดินข้างไม่ได้)</td><td>เหมาะพื้นแข็ง ขนส่งทางเรียบ</td></tr>
<tr><td><b>ล้อ Mecanum / Omni</b></td><td>เคลื่อนที่อิสระ (holonomic)</td><td>พื้นที่สัมผัสน้อย ลื่นไถลสูงบนพื้นขรุขระ</td><td>ห้ามใช้ในพื้นที่เกษตรหรือสนามรบดินโคลน</td></tr>
<tr><td><b>ตีนตะขาบ</b><br><small>Tracked drive</small></td><td>แรงกดหน้าดินต่ำ ยึดเกาะสูง</td><td>เลี้ยวแบบ skid-steering ทำให้ odometry คลาดเคลื่อนมาก</td><td>ทางเลือกหลักสำหรับสภาพแวดล้อมสุดขั้ว</td></tr>
</tbody></table></div>
</section>
<section class="sec"><h3>Suspension และจุดศูนย์ถ่วง (CoG) <span class="ref">S10</span></h3>
<ul><li><b>Mechanical filtering</b>: ระบบกันสะเทือนคือ “ฟิลเตอร์กรองข้อมูล” ด่านแรกของเซนเซอร์ ถ้าสั่นน้อย ภาพและ point cloud ก็คมชัด</li>
<li><b>Center of Gravity</b>: ออกแบบ CoG ต่ำ ป้องกันพลิกคว่ำบนพื้นลาดชัน (เช่น rocker-bogie suspension, wheelbase กว้าง)</li>
<li><b>Shock absorption</b>: ใช้โช้คอัพลดความล้าของวัสดุ (material fatigue) จากการทำงานต่อเนื่อง</li></ul>
</section>
<section class="sec"><h3>ความล้มเหลวของโครงสร้าง: Lever arm effect <span class="ref">S11</span></h3>
<p>ถ้าแท่นยึดเซนเซอร์โก่งหรือสั่นแค่ 1–2 mm (ขาดความแข็งเกร็ง) พารามิเตอร์ของโครงสร้างจะคลาดเคลื่อน โปรแกรมคำนวณผิดทั้งหมด · <b>Rule of thumb: ซอฟต์แวร์ชดเชยโครงสร้างที่ยวบยาบไม่ได้</b></p>
{{fig:lever}}
<div class="calc"><p class="stamp">คำนวณ (ขยายจากสไลด์)</p><p>สูตร: e = L · tan θ · หน่วย: L เป็นเมตร, θ เป็นองศา</p><p>e = 100 m × tan(1°) = 100 m × 0.01746 = <b>1.75 m</b> ≈ 2 m ตามที่สไลด์ปัดไว้</p></div>
</section>
<section class="sec"><h3>วัสดุเพื่อความอยู่รอด <span class="ref">S12</span></h3>
<ul><li><b>Carbon fiber</b>: เบาพิเศษ แข็งแรงเทียบเหล็ก แต่ราคาสูง → โดรน (UAV), แขนกลที่ต้องเร็ว (ลดแรงเฉื่อย)</li>
<li><b>Stainless steel 316L</b>: ทนกัดกร่อนและสารเคมี ล้างทำความสะอาดได้ → หุ่นเกษตร (ปุ๋ย/ยาฆ่าแมลง), หุ่นการแพทย์</li>
<li>การเลือกวัสดุไม่ใช่แค่เรื่องน้ำหนัก แต่คือการออกแบบสู้กับ<b>การกัดกร่อน</b>และ<b>ความเค็ม</b>ของสภาพแวดล้อม</li></ul>
</section>
<section class="sec"><h3>Perception error: เมื่อเซนเซอร์ถูกบดบัง <span class="ref">S13</span></h3>
<ul><li><b>LiDAR</b>: พื้นที่โล่งกว้าง ทุ่งนา ทะเลทราย (geometric degeneracy: ไม่มีโครงสร้างให้สะท้อน) หรือฝุ่นควันจัด</li>
<li><b>Camera</b>: แสงแดดส่องหน้าเลนส์ (glare), ภาพเบลอจากแรงสั่น, ความมืด</li>
<li><b>IMU</b>: สะสมความคลาดเคลื่อน (drift) ตามเวลา หากไม่มีเซนเซอร์อื่นช่วยรีเซ็ต</li>
<li><b>Wheel odometry</b>: ล้อลื่นไถลในโคลน สั่งวิ่ง 1 เมตรแต่ล้อฟรีอยู่กับที่</li></ul>
</section>
<section class="sec"><h3>แนวทางป้องกันความล้มเหลว <span class="ref">S14–15</span></h3>
<ul><li><b>Physical defenses</b>: ป้องกันเซนเซอร์ก่อนแก้ด้วยซอฟต์แวร์ เช่น sun hood กันแสงแฟลร์ กันโคลนกระเด็น</li>
<li><b>In-field calibration</b>: โครงสร้างบิดได้เมื่อเคลื่อนย้าย หุ่นต้องรีคาลิเบรตตัวเองหน้างาน เช่น หมุน 360° กลางแจ้งล้อมเป้า ChArUco เพื่อปรับแกน</li>
<li><b>Guarded move</b>: เขียนคำสั่งให้ฮาร์ดแวร์และซอฟต์แวร์ทำงานร่วมกัน ถ้า perception ตรวจพบความผิดปกติ (force &gt; threshold หรือสิ่งกีดขวาง) กลไกต้องหยุดทันที ป้องกันมอเตอร์ไหม้หรือพัง · ในสภาพแวดล้อมคาดเดาไม่ได้ ห้ามไว้ใจการเคลื่อนที่ 100%</li></ul>
{{fig:guarded}}
</section>
<section class="sec"><h3>Calibration และ Sensor fusion <span class="ref">S16–17</span></h3>
<ul><li><b>Hand-Eye calibration</b> (AX = XB หรือ AX = YB): หา transformation matrix ว่ากล้องอยู่ตรงไหนเมื่อเทียบกับปลายแขน เพื่อหยิบจับได้แม่น</li>
<li><b>Robot-World calibration</b>: ปรับเทียบพิกัดฐานหุ่น (mobile base) กับพิกัดโลก โดยหมุนตัวอยู่กับที่ (rotation-in-place) หาจุดอ้างอิง</li>
<li><b>Sensor fusion & EKF</b> (Error-State Kalman Filter): ระบบไม่ไว้ใจทุกเซนเซอร์เท่ากันตลอดเวลา เมื่อกล้องเจอแสงจ้า (visual noise สูง) จะลด <b>Kalman gain weight</b> ของกล้อง (ตัวอย่าง 10%) แล้วพึ่ง IMU และ LiDAR (90%) เพื่อประมาณ pose, velocity, bias แบบ real-time</li></ul>
</section>
<section class="sec"><h3>Monte Carlo Localization (MCL) และ aMCL <span class="ref">S18–20</span></h3>
<ol><li>t = 0: หุ่นอาจอยู่ที่ใดก็ได้ (prior สม่ำเสมอ)</li><li>t = 1: เห็นประตู → belief สูงเท่ากันที่ทุกประตู</li><li>t = 2: เคลื่อนที่ 1 ก้าว → belief เลื่อนตาม</li><li>t = 3: เห็นประตูอีกบาน → belief ที่ประตูที่สองสูงชัด</li><li>t = 4: เคลื่อนที่ต่อ</li></ol>
<p>อัลกอริทึม: ทุก particle ทำ <code>motion_update</code> → <code>sensor_update</code> (ได้น้ำหนัก w) → สุ่ม particle ชุดใหม่ตามน้ำหนัก (resampling) · bel(x<sub>t</sub>) = p(x<sub>t</sub> | z<sub>1:t</sub>, u<sub>1:t</sub>)</p>
<p><b>aMCL (Augmented MCL)</b>: เก็บค่าเฉลี่ยน้ำหนักระยะยาว w<sub>slow</sub> และระยะสั้น w<sub>fast</sub> แล้วเพิ่ม random particle ด้วยความน่าจะเป็น max(0, 1 − w<sub>fast</sub>/w<sub>slow</sub>) → แก้ <b>kidnapped robot problem</b> · ลดจำนวน laser beam ช่วยลดการคำนวณ · ลดความแรงของการอัปเดตน้ำหนักทำให้ช้าลงแต่เสถียรกว่า · ใน ROS2 ใช้แพ็กเกจ AMCL</p>
{{fig:mcl}}
</section>

<section class="sec"><h3>เซนเซอร์และการจัดวาง <span class="ref">S11–12</span></h3>
<ul><li><b>Environment & navigation</b>: LiDAR และ depth camera (RGB-D) สร้างแผนที่และหลบสิ่งกีดขวางที่เคลื่อนไหว · ultrasonic และ infrared ตรวจระยะประชิด</li>
<li><b>HRI</b>: tactile/touch sensor, microphone array (รับเสียง หาทิศ ตัดเสียงรบกวน), vision sensor (จดจำใบหน้า ภาษากาย)</li>
<li><b>Safety & state</b>: bumper + emergency stop, <b>cliff sensor</b> (ตรวจขอบโต๊ะ/บันได กันตก), IMU + wheel encoder (การทรงตัว/การเคลื่อนที่)</li>
<li><b>Sensor fusion & processing</b>: รวมข้อมูลหลายเซนเซอร์ เพิ่มความแม่นยำ ตัดสินใจระดับระบบ</li>
<li><b>Placement</b>: LiDAR ระดับต่ำแก้จุดบอดด้านล่าง (fixed low blind spot) + เซนเซอร์ระดับสายตามองไกล (long-range view)</li>
<li>Use cases: Healthcare (ส่งยา/อาหาร โครงสร้างทำความสะอาดง่าย ปลอดเชื้อ) · Hospitality (เสิร์ฟ นำทาง โครงสร้างมั่นคง ไม่เกะกะในที่แคบ) · Elderly care (ตรวจจับการล้ม โครงสร้างช่วยพยุง)</li></ul>
</section>
<section class="sec"><h3>อัลกอริทึม <span class="ref">S7, S13–17</span></h3>
<ul><li><b>Localization</b> ตอบ “ฉันอยู่ที่ไหน?” โดยต้องมีแผนที่อยู่แล้ว ใช้ AMCL (particle filter) เหมือนคนมีแผนที่และไฟฉาย · <b>SLAM</b> (Simultaneous Localization and Mapping) ไม่มีแผนที่ วาดเองพร้อมหาตำแหน่ง เหมือนนักสำรวจถ้ำ</li>
<li><b>Decision-making</b>: Behavior Trees, Finite State Machine (FSM) · <b>Reinforcement Learning</b>: agent, state, action, reward, environment, policy</li>
<li><b>Path planning</b>: A*, Dijkstra หาเส้นทางที่ดีที่สุด · <b>Local path planning</b>: Dynamic Window Approach, Artificial Potential Fields</li>
<li><b>Motion control</b>: closed-loop feedback ด้วย PID controller</li>
<li><b>Vision</b>: RGB-D/LiDAR/thermal camera → YOLO, CNN, semantic segmentation · Face recognition: detection → alignment → feature extraction (nodal points เช่น ระยะห่างตา) → recognition & classification</li>
<li><b>HRI 5 หมวด</b>: Perception (person, face & gaze tracking, pose, emotion) · Communication & understanding (ASR, NLU & intent, multimodal fusion) · Social navigation (proxemics path planning, trajectory prediction, social expressive motion) · Physical interaction & safety (impedance/admittance control, collision reaction, handover) · Expressive feedback (gaze & attention, shared autonomy & non-verbal cues, expressive motion)</li></ul>

<li>ต้องผ่าน <b>IRB/EC</b> (คณะกรรมการพิจารณาจริยธรรม) ก่อนเริ่ม และถูกติดตามระหว่างทำ</li>

<li>ประเด็นสำคัญ: ความปลอดภัยทางกายภาพ · ความยินยอมและข้อมูลส่วนบุคคล · ความเหมาะสมทางสังคมและจิตวิทยา</li></ul>

<li>หลัก 7 ข้อ: Involve stakeholders · Understand what changes · Value the things that matter · Only include what is material · Do not overclaim · Be transparent · Verify the result</li>
<li><b>Theory of Change</b>: Inputs → Outputs → Outcomes → Impact</li>
<li>ตัวกรองกันเคลมเกินจริง: Gross social value → <b>Deadweight</b> (จะเกิดอยู่แล้วแม้ไม่มีหุ่นไหม) → <b>Attribution</b> (ปัจจัยอื่นช่วยกี่ %) → <b>Displacement</b> (แค่ย้ายปัญหาไปที่อื่นไหม) → <b>Drop-off</b> (ผลลดลงปีละเท่าไร) → Net social value</li>
<li><b>SROI ratio = มูลค่าปัจจุบันของผลกระทบสังคมสุทธิ ÷ มูลค่าเงินลงทุน</b> · &gt; 1:1 คุ้มค่า · 1:1 คืนทุนพอดี · &lt; 1:1 ต้องปรับปรุง · ห้ามเทียบสัดส่วนข้ามองค์กร ให้เทียบภายในองค์กรเองตามเวลา</li>
<li>ผู้ได้รับประโยชน์: Primary ผู้ใช้งาน (ผู้สูงอายุ ผู้ป่วย แขก) · Secondary ผู้ดูแล (พยาบาล ครอบครัว ลด burnout) · Tertiary ระบบ/รัฐ (ลดงบสาธารณสุข)</li>

<ul><li><b>ไม้/กระดาษแข็ง</b>: ถูกที่สุด ตัดแต่งง่าย เหมาะทำต้นแบบ · ข้อจำกัด: รับแรงได้น้อย ถ้าต้องการแข็งแรงต้องเพิ่มความหนาจนหนักมาก ดูดซับความชื้น</li>
<li><b>แก้ว</b>: เฉื่อยทางเคมีสูง โปร่งใส ใช้กับพื้นที่อันตราย (glovebox robots) · ข้อจำกัด: เปราะ แตกง่าย ไม่รับแรงกระแทก</li>
<li><b>คาร์บอนไฟเบอร์</b>: stiffness-to-weight ดีที่สุด ซ่อนสายไฟหรือมอเตอร์ในท่อได้ · ข้อจำกัด: แพง ตัดแต่งยาก ไม่เหมาะกับการเจาะรูยึดน็อต</li>
<li><b>ยางและเคฟลาร์</b>: ยางสร้างผิวหนึบ ยืดหยุ่น ปลอดภัยต่อคน · เคฟลาร์ป้องกันอุณหภูมิสุดขั้ว แรงดัน และแรงกระแทก</li></ul>
</section>
<section class="sec"><h3>การประกอบ (Assembly mechanics) <span class="ref">S17–20</span></h3>
<p>โครงสร้างจะแข็งเกร็งหรือไม่ ไม่ได้อยู่ที่วัสดุอย่างเดียว แต่อยู่ที่ <b>จุดเชื่อมต่อ (joints)</b></p>
<div class="tbl"><table><thead><tr><th>วิธี</th><th>ใช้เมื่อ</th><th>ข้อควรระวัง</th></tr></thead><tbody>
<tr><td><b>Welding</b> (ถาวร)</td><td>ต้องการโครงสร้างถาวรรับแรงสูง เช่น ฐานเหล็ก</td><td>ความร้อนทำโลหะเสียรูป (distortion) · อลูมิเนียมเชื่อมยากกว่าเหล็ก · รอยเชื่อมสแตนเลสต้องขัดเรียบกันแบคทีเรีย</td></tr>
<tr><td><b>Bolting</b> (modular)</td><td>ต้องการถอดประกอบ ซ่อมบำรุง เปลี่ยนโมดูล เช่น อลูมิเนียมโปรไฟล์</td><td>แรงสั่นทำน็อตคลาย → ใช้น้ำยากันคลาย (threadlocker) หรือ Nyloc nut</td></tr>
<tr><td><b>Quick joints</b></td><td>ประกอบท่อรวดเร็วโดยไม่ต้องเชื่อม ถอดแล้วประกอบใหม่ง่าย</td><td>—</td></tr>
<tr><td><b>Riveting</b></td><td>แผ่นโลหะบาง/กล่องอลูมิเนียมที่ไม่ต้องถอด น้ำหนักเบา</td><td>ไม่รับแรงดึงหรือแรงบิดสูง</td></tr>
<tr><td><b>T-nuts & T-bolts</b></td><td>สอดเข้าร่อง T/V-slot ล็อกตำแหน่ง ปรับได้ยืดหยุ่น</td><td>—</td></tr>
<tr><td><b>Corner / Blind brackets</b></td><td>ฉากยึดมุม 90° เพิ่มความแข็งแรง / ฉากซ่อนในร่องให้ดูเรียบร้อย</td><td>—</td></tr>
</tbody></table></div>
<ul><li><b>พลาสติก/3D print</b>: ฝัง heat-set inserts (เกลียวทองเหลืองด้วยหัวแร้ง) เพื่อขันน็อตซ้ำได้โดยเกลียวไม่รูด หรือออกแบบข้อต่อสวมล็อก (snap-fit / dovetail)</li>
<li><b>คาร์บอนไฟเบอร์</b>: ห้ามเจาะรูเด็ดขาด ใช้ข้อต่อสวมอัด (press-fit) ร่วมกับกาวโครงสร้าง (epoxy) กระจายแรงทั่วผิวสัมผัส</li>
<li><b>แก้ว</b>: ห้ามน็อตหรือโลหะสัมผัสแก้วโดยตรง ยึดผ่านโครงโลหะที่บุด้วยปะเก็นยาง (gasket) ซับแรงสั่น หรือใช้กาว UV</li></ul>
{{fig:glass}}
</section>
<section class="sec"><h3>เลือกวัสดุตามสภาพแวดล้อม และ Hybrid robot <span class="ref">S21–25</span></h3>
<div class="tbl"><table><thead><tr><th>สภาพแวดล้อม</th><th>Focus</th><th>วัสดุ</th></tr></thead><tbody>
<tr><td>Food / Medical / Chem</td><td>ความปลอดภัยทางชีวภาพ การกัดกร่อน</td><td>สแตนเลส (ขัดรอยเชื่อม), พลาสติก PE food grade, แก้ว (ตู้ปลอดเชื้อ)</td></tr>
<tr><td>Heavy industrial</td><td>ทนความร้อน รับ payload มหาศาล</td><td>เหล็กโครงสร้าง, อลูมิเนียมซีรีส์ 40/80, รอยเชื่อม + น็อตขนาดใหญ่</td></tr>
<tr><td>Agile / DIY / Education</td><td>น้ำหนักเบา ความเร็ว ปรับแต่งง่าย</td><td>อลูมิเนียม V-slot, คาร์บอนไฟเบอร์, ชิ้นส่วน 3D print, ไม้/กระดาษ</td></tr>

<script>
/* ===== คลาส ===== */
const strip = s => String(s).replace(/<[^>]*>/g, "");

/* เก็บคะแนนสูงสุดในเบราว์เซอร์ */
class Store {
  static all() { try { return JSON.parse(localStorage.getItem(CONFIG.STORE_KEY) || "{}") || {}; } catch (e) { return {}; } }
  static best(id) { const v = Store.all()[id]; return typeof v === "number" ? v : null; }
  static save(id, pct) {
    try { const o = Store.all(); if (o[id] == null || pct > o[id]) { o[id] = pct; localStorage.setItem(CONFIG.STORE_KEY, JSON.stringify(o)); } } catch (e) { /* storage blocked */ }
  }
}

/* ตรวจคำตอบเติมคำ */
class Grader {
  static norm(s) {
    return String(s ?? "").normalize("NFC").replace(/ํา/g, "ำ").toLowerCase()
      .replace(/[\s\-_.,:;'"“”‘’()\[\]\/·]/g, "");
  }
  static isNum(spec) { return !Array.isArray(spec); }
  static toNum(s) { const m = String(s ?? "").replace(/,/g, "").match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
  static ok(input, spec) {
    if (Grader.isNum(spec)) { const v = Grader.toNum(input); return Number.isFinite(v) && Math.abs(v - spec.n) <= (spec.tol || 1e-9); }
    const n = Grader.norm(input);
    return n !== "" && spec.some(a => Grader.norm(a) === n);
  }
  static label(spec) { return Grader.isNum(spec) ? (spec.show || String(spec.n)) : spec[0]; }
  static alts(spec) { return (!Grader.isNum(spec) && spec.length > 1) ? ` <span class="alt">(รับ: ${spec.slice(1, 4).join(", ")})</span>` : ""; }
}

/* สุ่มและสลับลำดับ */
class Picker {
  static shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
  static take(a, n) { return Picker.shuffle(a).slice(0, Math.min(n, a.length)); }
}

/* กระดานวาดรูป */
class DrawPad {
  constructor(root) {
    this.root = root; this.cv = root.querySelector("canvas"); this.ctx = this.cv.getContext("2d");
    this.cv.width = CONFIG.CANVAS.w; this.cv.height = CONFIG.CANVAS.h;
    this.strokes = []; this.cur = null; this.tool = "pen"; this.locked = false;
    this.cv.addEventListener("pointerdown", e => this.down(e));
    this.cv.addEventListener("pointermove", e => this.move(e));
    ["pointerup", "pointercancel"].forEach(t => this.cv.addEventListener(t, () => this.up()));
    root.querySelectorAll("[data-tool]").forEach(b => b.addEventListener("click", () => this.setTool(b.dataset.tool)));
    root.querySelector("[data-pad=undo]").addEventListener("click", () => this.undo());
    root.querySelector("[data-pad=clear]").addEventListener("click", () => this.clear());
    DrawPad.live.add(this);
    this.setTool("pen");
  }
  setTool(t) { if (this.locked) return; this.tool = t; this.root.querySelectorAll("[data-tool]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === t))); }
  pos(e) { const r = this.cv.getBoundingClientRect(); return [(e.clientX - r.left) * this.cv.width / r.width, (e.clientY - r.top) * this.cv.height / r.height]; }
  style(tool) {
    const cs = getComputedStyle(document.documentElement);
    return { color: cs.getPropertyValue(tool === "blue" ? "--blue" : "--ink").trim(), width: CONFIG.PEN[tool], erase: tool === "eraser" };
  }
  seg(st, a, b) {
    const x = this.ctx;
    x.globalCompositeOperation = st.erase ? "destination-out" : "source-over";
    x.strokeStyle = st.erase ? "#000" : st.color; x.lineWidth = st.width; x.lineCap = "round"; x.lineJoin = "round";
    x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke();
  }
  down(e) {
    if (this.locked) return;
    e.preventDefault();
    try { this.cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const p = this.pos(e);
    this.cur = { tool: this.tool, pts: [p], st: this.style(this.tool) };
    this.strokes.push(this.cur);
    this.seg(this.cur.st, p, [p[0] + 0.01, p[1]]);
    this.root.dispatchEvent(new CustomEvent("drawn", { bubbles: true }));
  }
  move(e) { if (!this.cur) return; const p = this.pos(e), pts = this.cur.pts; this.seg(this.cur.st, pts[pts.length - 1], p); pts.push(p); }
  up() { this.cur = null; }
  redraw() {
    this.ctx.clearRect(0, 0, this.cv.width, this.cv.height);
    for (const s of this.strokes) {
      s.st = this.style(s.tool);
      const p = s.pts; this.seg(s.st, p[0], [p[0][0] + 0.01, p[0][1]]);
      for (let i = 1; i < p.length; i++) this.seg(s.st, p[i - 1], p[i]);
    }
    this.ctx.globalCompositeOperation = "source-over";
  }
  undo() { if (this.locked) return; this.strokes.pop(); this.redraw(); this.root.dispatchEvent(new CustomEvent("drawn", { bubbles: true })); }
  clear() { if (this.locked) return; this.strokes = []; this.redraw(); this.root.dispatchEvent(new CustomEvent("drawn", { bubbles: true })); }
  lock(v) { this.locked = v; this.root.classList.toggle("locked", v); }
  get empty() { return this.strokes.length === 0; }
  dispose() { DrawPad.live.delete(this); }
}
DrawPad.live = new Set();

/* วาดเส้นใหม่เมื่อธีมเปลี่ยน */
class ThemeWatch {
  static start() {
    const f = () => DrawPad.live.forEach(p => p.redraw());
    const mq = matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", f);
    new MutationObserver(f).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }
}

        <div class="card-act"><a class="btn sm alt" href="#${ch.id}">อ่านสรุป</a><a class="btn sm" href="#${ch.id}-quiz">ทำควิซ</a>${b != null ? `<span class="best">ดีที่สุด ${b}%</span>` : ""}</div></article>`;

      <div class="grid">${cards}</div>

        <p>สไลด์บท 11 (S15, อ้างอิง Corey Ford, Stanford d.school) ให้ภาพนวัตกรรมเป็นจุดตัดของ 3 วง และเปลี่ยนจาก Design → Design Thinking: individuals → teams, products → experiences, eng + art → tech + biz + human</p>
        <figure class="fig">${FIG.dtvenn}</figure>

        <div class="tbl"><table><thead><tr><th>ขั้น</th><th>ทำอะไร</th><th>ตัวอย่างจากบทเรียน</th></tr></thead><tbody>
          <tr><td><b>Empathize</b></td><td>ลงไปเข้าใจผู้ใช้และพื้นที่จริง</td><td>เกษตรกรในแปลงโคลน (09) · ผู้สูงอายุ/พยาบาล (10) · ผู้ป่วยผ่าตัด (11)</td></tr>
          <tr><td><b>Define</b></td><td>เขียนโจทย์และข้อจำกัดให้ชัด</td><td>“ทำงานข้างคนโดยไม่มีรั้ว” → Cobot (07) · “ห้ามแผลฉีก” → RCM (11)</td></tr>
          <tr><td><b>Ideate</b></td><td>คิดหลายทางเลือกแล้วเทียบ</td><td>Cartesian / SCARA / Delta (07) · ล้อ vs ตีนตะขาบ (09) · Hybrid materials (12)</td></tr>

          <tr><td><b>Test</b></td><td>ทดสอบในสภาพจริงแล้ววนกลับไปแก้</td><td>Calibration (08) · In-field test (09) · SROI วัดผลกระทบ (10)</td></tr>
        </tbody></table></div>

/* หน้าสรุปบทเรียน */
class SummaryView {
  constructor(el) { this.el = el; }
  render(ch) {
    const body = ch.sum.replace(/\{\{fig:(\w+)\}\}/g, (_, k) => `<figure class="fig">${FIG[k] || ""}</figure>`);

      <p class="eyebrow">บท ${ch.no} · ${ch.term} · ${ch.slides} สไลด์</p>

      <p class="muted" style="font-size:.85rem">ป้าย <span class="ref">S12</span> = เลขหน้าสไลด์ต้นฉบับ · <span class="ext">เสริม</span> = ข้อมูลนอกสไลด์</p>

  }
}

/* หน้าควิซ: สร้างชุดข้อ ตรวจ และแสดงเฉลย */
class QuizView {
  constructor(el) {
    this.el = el; this.set = null; this.done = false; this.pads = [];
    el.addEventListener("input", () => this.progress());
    el.addEventListener("drawn", () => this.progress());
    el.addEventListener("change", e => { if (e.target.matches("select[data-m]")) this.progress(); if (e.target.matches("input[data-c]")) this.score(); });
    el.addEventListener("click", e => this.onClick(e));
  }
  makeSet(id) {
    if (id === "mix") {
      return {
        id, title: "สุ่มรวมทุกบท (07–12)",
        fill: BANK.flatMap(ch => Picker.take(ch.fill, CONFIG.MIX.fillPerChapter).map(q => ({ ...q, tag: ch.no }))),
        match: Picker.take(BANK.flatMap(ch => ch.match.map(m => ({ ...m, tag: ch.no }))), CONFIG.MIX.match),
        draw: Picker.take(BANK.flatMap(ch => ch.draw.map(d => ({ ...d, tag: ch.no }))), CONFIG.MIX.draw)
      };
    }
    const ch = BANK.find(c => c.id === id);
    return {
      id, ch, title: `บท ${ch.no} · ${ch.en}`,
      fill: Picker.take(ch.fill, CONFIG.QUIZ.fill).map(q => ({ ...q })),
      match: Picker.take(ch.match, CONFIG.QUIZ.match).map(m => ({ ...m })),
      draw: Picker.take(ch.draw, CONFIG.QUIZ.draw).map(d => ({ ...d }))
    };
  }
  open(id, fresh) { if (fresh || !this.set || this.set.id !== id) this.set = this.makeSet(id); this.render(); }
  leave() { this.pads.forEach(p => p.dispose()); this.pads = []; }
  badges(q) { return `${q.tag ? `<span class="tag">บท ${q.tag}</span>` : ""}${q.dt ? `<span class="dtag">DT</span>` : ""}${q.x ? `<span class="ext">เสริม</span>` : ""}`; }
  fillHTML(q, i) {
    const parts = q.q.split("___");
    let body = "";
    parts.forEach((p, k) => {
      body += p;
      if (k < parts.length - 1) {
        const spec = q.a[k], num = Grader.isNum(spec);
        const w = num ? 7 : Math.min(16, Math.max(6, Grader.label(spec).length + 2));
        body += `<input class="blank" id="f${i}_${k}" style="width:${w}ch" ${num ? 'inputmode="decimal"' : ""} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ข้อ A${i + 1} ช่องที่ ${k + 1}">`;
      }
    });
    return `<article class="q" id="qf${i}"><div class="qno">A${i + 1} ${this.badges(q)}</div><p class="qt">${body}</p><div class="reveal" id="rf${i}" hidden></div></article>`;
  }
  matchHTML(m, i) {
    const rows = m._rows.map(pi => `<div class="mrow" id="mr${i}_${pi}"><div class="ml">${m.pairs[pi][0]}</div>
      <select id="m${i}_${pi}" data-m="${i}" aria-label="จับคู่กับ ${strip(m.pairs[pi][0])}"><option value="">— เลือกคำตอบ —</option>${m._opts.map((o, oi) => `<option value="${oi}">${o}</option>`).join("")}</select>
      <div class="mfix" hidden></div></div>`).join("");
    return `<article class="q"><div class="qno">B${i + 1} ${this.badges(m)}</div><p class="qt" style="line-height:1.6">${m.q}</p><div class="mgrid">${rows}</div></article>`;
  }
  drawHTML(d, i) {
    return `<article class="q"><div class="qno">C${i + 1} ${this.badges(d)}</div><p class="qt" style="line-height:1.6">${d.q}</p>
      <div class="pad" id="pad${i}"><div class="tools" role="toolbar" aria-label="เครื่องมือวาด">
        <button type="button" data-tool="pen">ปากกา</button><button type="button" data-tool="blue">สีน้ำเงิน</button><button type="button" data-tool="eraser">ยางลบ</button>
        <span class="sp"></span><button type="button" data-pad="undo">ย้อนกลับ</button><button type="button" data-pad="clear">ล้างทั้งหมด</button></div>
        <canvas aria-label="พื้นที่วาดรูปข้อ C${i + 1}"></canvas></div>
      <div class="reveal" id="rd${i}" hidden></div></article>`;
  }
  render() {
    this.leave(); this.done = false;
    const s = this.set;
    s.fill.forEach(q => { q._over = false; q._res = null; });
    s.match.forEach(m => { m._rows = Picker.shuffle(m.pairs.map((_, k) => k)); m._opts = Picker.shuffle([...new Set(m.pairs.map(p => p[1]).concat(m.extra || []))]); });
    const head = s.ch
      ? `<p class="eyebrow">บท ${s.ch.no} · ${s.ch.term}</p><h1>${s.ch.en}</h1><p class="lead">${s.ch.th}</p>
         <nav class="tabs" aria-label="มุมมองบท"><a href="#${s.ch.id}">สรุปเนื้อหา</a><a href="#${s.ch.id}-quiz" aria-current="page">ควิซ</a></nav>`
      : `<p class="eyebrow">ทบทวนรวม</p><h1>${s.title}</h1><p class="lead">สุ่มจากคลังข้อของทุกบท ป้ายสีเทาบอกว่ามาจากบทไหน</p>`;
    this.el.innerHTML = `${head}
      <p class="muted" style="font-size:.9rem">เติมคำพิมพ์ได้ทั้งไทยหรืออังกฤษตามศัพท์ในสไลด์ (ตัวพิมพ์เล็ก/ใหญ่ไม่มีผล) · ตัวเลขพิมพ์เฉพาะตัวเลข</p>
      <div id="scorebox" class="scorebox" hidden></div>
      <section class="qsec"><h2>ตอน A · เติมคำ <small>${s.fill.length} ข้อ</small></h2>${s.fill.map((q, i) => this.fillHTML(q, i)).join("")}</section>
      <section class="qsec"><h2>ตอน B · จับคู่ <small>${s.match.length} ชุด</small></h2>${s.match.map((m, i) => this.matchHTML(m, i)).join("")}</section>
      <section class="qsec"><h2>ตอน C · วาดรูปแสดงคำตอบ <small>${s.draw.length} ข้อ</small></h2><p class="muted" style="font-size:.9rem">วาดด้วยนิ้ว ปากกา หรือเมาส์ เมื่อส่งแล้วจะเห็นภาพเฉลยและเช็กลิสต์ให้ประเมินตัวเอง</p>${s.draw.map((d, i) => this.drawHTML(d, i)).join("")}</section>
      <div class="qbar"><div class="qbar-in"><span id="qprog" class="qprog" aria-live="polite"></span><div class="qbtns" id="qbtns"></div></div></div>`;
    this.el.querySelectorAll(".pad").forEach(r => this.pads.push(new DrawPad(r)));
    this.buttons(); this.progress();
  }
  buttons() {
    const b = this.el.querySelector("#qbtns");
    b.innerHTML = this.done
      ? `<button type="button" class="btn alt sm" data-q="retry">ทำชุดเดิมอีกครั้ง</button><button type="button" class="btn sm hi" data-q="fresh">สุ่มชุดใหม่</button>`
      : `<button type="button" class="btn" data-q="submit">ส่งคำตอบ</button>`;
  }
  progress() {
    if (this.done) return;
    const blanks = [...this.el.querySelectorAll("input.blank")], sels = [...this.el.querySelectorAll("select[data-m]")];
    const filled = blanks.filter(x => x.value.trim()).length + sels.filter(x => x.value !== "").length;
    const drawn = this.pads.filter(p => !p.empty).length;
    const p = this.el.querySelector("#qprog");
    if (p) p.textContent = `ตอบแล้ว ${filled}/${blanks.length + sels.length} ช่อง · วาดแล้ว ${drawn}/${this.pads.length}`;
  }
  submit() {
    if (this.done) return;
    this.done = true;
    const s = this.set;
    s.fill.forEach((q, i) => {
      q._res = q.a.map((spec, k) => {
        const inp = this.el.querySelector(`#f${i}_${k}`); const ok = Grader.ok(inp.value, spec);
        inp.classList.add(ok ? "ok" : "bad"); inp.readOnly = true; return ok;
      });
      const all = q._res.every(Boolean), rv = this.el.querySelector(`#rf${i}`);
      rv.hidden = false;
      rv.innerHTML = `<p>${all ? '<b class="okc">✓ ถูกทั้งหมด</b>' : '<b class="badc">เฉลย</b>'} ${q.a.map(spec => `<mark>${Grader.label(spec)}</mark>${Grader.alts(spec)}`).join(" · ")}</p>
        ${q.ex ? `<p class="ex">${q.ex}</p>` : ""}${q.s ? `<p class="src">อ้างอิง: สไลด์ ${q.s}</p>` : ""}
        ${all ? "" : `<button type="button" class="ghost" data-q="over" data-i="${i}" aria-pressed="false">คำตอบฉันความหมายเดียวกัน · นับให้</button>`}`;
    });
    s.match.forEach((m, i) => {
      m._res = m.pairs.map((p, pi) => {
        const sel = this.el.querySelector(`#m${i}_${pi}`), right = m._opts.indexOf(p[1]);
        const ok = sel.value !== "" && Number(sel.value) === right;
        sel.classList.add(ok ? "ok" : "bad"); sel.disabled = true;
        const fx = this.el.querySelector(`#mr${i}_${pi} .mfix`); fx.hidden = false;
        fx.innerHTML = ok ? '<span class="okc">✓ ถูก</span>' : `<span class="badc">✗ คำตอบที่ถูก:</span> <mark>${p[1]}</mark>`;
        return ok;
      });
      if (m.s) this.el.querySelector(`#mr${i}_${m._rows[m._rows.length - 1]}`).insertAdjacentHTML("afterend", `<p class="src" style="font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin:8px 0 0">อ้างอิง: สไลด์ ${m.s}</p>`);
    });
    s.draw.forEach((d, i) => {
      this.pads[i].lock(true);
      const rv = this.el.querySelector(`#rd${i}`); rv.hidden = false;
      rv.innerHTML = `<p><b>ภาพเฉลย</b> เทียบกับรูปของคุณ แล้วติ๊กข้อที่วาดหรืออธิบายได้ครบ</p>
        <figure class="fig">${FIG[d.fig] || ""}</figure>
        <fieldset class="chk"><legend>เช็กลิสต์ประเมินตัวเอง</legend>${d.check.map((c, k) => `<label><input type="checkbox" id="c${i}_${k}" data-c="${i}"><span>${c}</span></label>`).join("")}</fieldset>
        ${d.ex ? `<p class="ex">${d.ex}</p>` : ""}<p class="src">อ้างอิง: สไลด์ ${d.s}</p>`;
    });
    this.score(); this.buttons();
    const box = this.el.querySelector("#scorebox");
    box.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  score() {
    if (!this.done) return;
    const s = this.set; let a = 0, at = 0, d = 0, dt = 0;
    s.fill.forEach(q => { at += q.a.length; a += q._over ? q.a.length : q._res.filter(Boolean).length; });
    s.match.forEach(m => { at += m.pairs.length; a += m._res.filter(Boolean).length; });
    s.draw.forEach((x, i) => { dt += x.check.length; d += this.el.querySelectorAll(`input[data-c="${i}"]:checked`).length; });
    const pct = Math.round(100 * (a + d) / Math.max(1, at + dt));
    Store.save(s.id, pct);
    const verdict = pct >= 80 ? "พร้อมสอบส่วนนี้แล้ว กดสุ่มชุดใหม่เพื่อเก็บข้อที่ยังไม่เจอ"
      : pct >= 50 ? "อ่านเฉลยและคำอธิบายของข้อที่ผิด แล้วทำชุดเดิมอีกครั้ง"
      : "กลับไปอ่านสรุปบทนี้ก่อน แล้วค่อยทำชุดเดิมอีกครั้ง";
    const box = this.el.querySelector("#scorebox"); box.hidden = false;
    box.innerHTML = `<div class="big">${pct}<small>%</small></div><div>
      <p>เติมคำ + จับคู่ (ตรวจอัตโนมัติ): <b>${a}/${at}</b></p>
      <p>วาดรูป (ประเมินตนเอง): <b>${d}/${dt}</b> <span class="muted">· ติ๊กเช็กลิสต์ใต้ภาพเฉลย</span></p>
      <p class="muted">${verdict}</p>${s.ch ? `<p><a href="#${s.ch.id}">อ่านสรุปบท ${s.ch.no}</a></p>` : ""}</div>`;
    const p = this.el.querySelector("#qprog"); if (p) p.textContent = `คะแนน ${a + d}/${at + dt} (${pct}%)`;
  }
  onClick(e) {
    const b = e.target.closest("[data-q]"); if (!b) return;
    const act = b.dataset.q;
    if (act === "submit") this.submit();
    else if (act === "retry") { this.render(); window.scrollTo(0, 0); }
    else if (act === "fresh") { this.open(this.set.id, true); window.scrollTo(0, 0); }
    else if (act === "over") {
      const i = +b.dataset.i, q = this.set.fill[i]; q._over = !q._over;
      b.setAttribute("aria-pressed", String(q._over));
      b.textContent = q._over ? "นับให้แล้ว · กดอีกครั้งเพื่อยกเลิก" : "คำตอบฉันความหมายเดียวกัน · นับให้";
      this.el.querySelectorAll(`#qf${i} input.blank.bad`).forEach(inp => inp.classList.toggle("ov", q._over));
      this.score();
    }
  }
}

/* ตัวควบคุมหลัก: เส้นทาง (hash) และแถบเลือกบท */
class App {
  constructor() {
    this.main = document.getElementById("main"); this.nav = document.getElementById("chips");
    this.home = new HomeView(this.main); this.sum = new SummaryView(this.main); this.quiz = new QuizView(this.main);
  }
  start() { ThemeWatch.start(); this.renderNav(); addEventListener("hashchange", () => this.route()); this.route(); }
  renderNav() {
    this.nav.innerHTML = `<a class="chip" href="#" data-r="">หน้าแรก</a>` +
      BANK.map(ch => `<a class="chip" href="#${ch.id}" data-r="${ch.id}"><b>${ch.no}</b><small>${ch.short}</small></a>`).join("") +
      `<a class="chip" href="#mix" data-r="mix">สุ่มรวม</a>`;
  }
  route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const id = h.replace(/-quiz$/, ""), ch = BANK.find(c => c.id === id);
    this.quiz.leave();
    if (h === "mix") this.quiz.open("mix");
    else if (ch && h.endsWith("-quiz")) this.quiz.open(ch.id);
    else if (ch) this.sum.render(ch);
    else this.home.render();
    const key = h === "mix" ? "mix" : (ch ? ch.id : "");
    this.nav.querySelectorAll(".chip").forEach(c => { if (c.dataset.r === key) { c.setAttribute("aria-current", "page"); c.scrollIntoView({ block: "nearest", inline: "nearest" }); } else c.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
}

const boot = () => { window.__app = new App(); window.__app.start(); };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
</script>
